{% extends 'base.html' %}

{% block title %}Lista de Clientes - PocoManut{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Lista de Clientes</h1>
    <button type="button" class="btn btn-primary"
        hx-get="{% url 'web:cliente_create' %}"
        hx-target="#modal-content"
        hx-on::after-request="bootstrap.Modal.getOrCreateInstance(document.getElementById('modal')).show()">
        Novo Cliente
    </button>
</div>

<div class="mb-4">
    <input 
        type="search" name="q" class="form-control" 
        placeholder="Buscar por nome ou CPF/CNPJ, cidade..."
        hx-get="{% url 'web:lista_clientes' %}"
        hx-trigger="keyup changed delay:500ms, search"
        hx-target="#tabela-clientes-wrapper"
        hx-swap="innerHTML"
    >
</div>

<div id="tabela-clientes-wrapper"
    hx-get="{% url 'web:lista_clientes' %}"
    hx-trigger="updateClienteList from:body"
    hx-target="this"
    hx-swap="innerHTML">
    {% include 'core/partials/lista_clientes_tabela.html' %}
</div>
{% endblock %}
