{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PocoManut</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/icons/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/icons/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/icons/favicon-16x16.png' %}">
    <link rel="shortcut icon" href="{% static 'img/icons/favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url("{% static 'img/bannerPocosBombas.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animação de gotas d'água */
        .drops {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .drop {
            position: absolute;
            width: 3px;
            background: linear-gradient(transparent, rgba(255,255,255,0.3));
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-100vh); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .card-body-glass {
            padding: 40px 35px;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(52, 152, 219, 0.4);
        }

        .logo-container img {
            width: 50px;
            height: 50px;
        }

        .logo-container i {
            font-size: 32px;
            color: white;
        }

        .title {
            color: white;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-right: none;
            color: rgba(255, 255, 255, 0.8);
            border-radius: 10px 0 0 10px;
            padding: 12px 15px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            color: white !important;
            border-radius: 0 10px 10px 0 !important;
            padding: 12px 15px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2) !important;
            border-color: rgba(52, 152, 219, 0.6) !important;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            color: white !important;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.5);
            background: linear-gradient(135deg, #2980b9, #2471a3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert-danger-custom {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.4);
            border-radius: 10px;
            color: #ffcccc;
            padding: 12px 15px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .alert-danger-custom i {
            margin-right: 8px;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .footer-text p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            margin: 0;
        }

        .footer-text strong {
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <!-- Gota d'água animada -->
    <div class="drops" id="drops"></div>

    <div class="login-container">
        <div class="glass-card">
            <div class="card-body-glass">
                
                <!-- Logo -->
                <div class="logo-container">
                    <img src="{% static 'img/icons/favicon-64x64.png' %}" alt="PocoManut">
                </div>

                <!-- Título -->
                <h2 class="title">Bem-vindo</h2>
                <p class="subtitle">Acesse sua conta para gerenciar poços e manutenções.</p>

                <!-- Mensagens de Erro -->
                {% if form.errors %}
                <div class="alert-danger-custom">
                    <i class="fa fa-exclamation-circle"></i>
                    Usuário ou senha incorretos. Tente novamente.
                </div>
                {% endif %}

                <!-- Formulário -->
                <form method="post">
                    {% csrf_token %}

                    <!-- Campo Usuário -->
                    <label class="form-label">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-user"></i>
                        </span>
                        <input type="text" name="username" class="form-control" placeholder="Digite seu usuário" required autofocus>
                    </div>

                    <!-- Campo Senha -->
                    <label class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa fa-lock"></i>
                        </span>
                        <input type="password" name="password" class="form-control" placeholder="Digite sua senha" required>
                    </div>

                    <!-- Botão Entrar -->
                    <button type="submit" class="btn-login">
                        <i class="fa fa-sign-in-alt me-2"></i>Entrar no Sistema
                    </button>

                </form>

                <!-- Rodapé -->
                <div class="footer-text">
                    <p>&copy; {% now "Y" %} <strong>PocoManut</strong></p>
                    <p>Controle de Poços Artesianos</p>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Criar gotas d'água animadas
        function createDrops() {
            var container = document.getElementById('drops');
            var numDrops = 30;
            
            for (var i = 0; i < numDrops; i++) {
                var drop = document.createElement('div');
                drop.className = 'drop';
                drop.style.left = Math.random() * 100 + '%';
                drop.style.height = Math.random() * 80 + 40 + 'px';
                drop.style.animationDuration = Math.random() * 3 + 2 + 's';
                drop.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(drop);
            }
        }
        createDrops();
    </script>

</body>
</html>
