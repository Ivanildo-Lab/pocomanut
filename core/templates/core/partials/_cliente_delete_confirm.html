<form
    hx-post="{% url 'web:cliente_delete' cliente.pk %}"
    hx-target="#modal-content"
    hx-swap="innerHTML"
>
  {% csrf_token %}
  <div class="modal-header">
    <h5 class="modal-title text-danger">Confirmar Exclusão</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
  </div>
  <div class="modal-body">
    <p>Tem certeza que deseja excluir o cliente <strong>{{ cliente.nome_razao_social }}</strong>?</p>
    <p class="text-danger">Todos os poços associados a este cliente também serão excluídos. Esta ação não pode ser desfeita.</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
    <button type="submit" class="btn btn-danger">Sim, Excluir</button>
  </div>
</form>
