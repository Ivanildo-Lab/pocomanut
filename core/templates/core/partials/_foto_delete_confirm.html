<form hx-post="{% url 'web:excluir_foto_poco' foto.poco.pk foto.pk %}">
  {% csrf_token %}
  <div class="modal-header">
    <h5 class="modal-title text-danger">Confirmar Exclusão</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
  </div>
  <div class="modal-body">
    <p>Tem certeza que deseja excluir esta foto?</p>
    <img src="{{ foto.imagem.url }}" class="img-fluid rounded mb-3">
    <p class="text-danger">Esta ação não pode ser desfeita.</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
    <button type="submit" class="btn btn-danger">Sim, Excluir</button>
  </div>
</form>
