<form hx-post="{{ request.path }}" hx-target="body">
  {% csrf_token %}
  <div class="modal-header">
    <h5 class="modal-title text-danger">Confirmar Exclusão</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
  </div>
  <div class="modal-body">
    <p>Tem certeza que deseja excluir o registro de manutenção de <strong>{{ manutencao.data_manutencao|date:"d/m/Y" }}</strong>?</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
    <button type="submit" class="btn btn-danger">Sim, Excluir</button>
  </div>
</form>
